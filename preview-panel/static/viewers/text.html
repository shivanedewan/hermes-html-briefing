<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text preview</title><link rel="stylesheet" href="viewer.css">
<style>
.scroll{background:#fff}
.code{display:grid;grid-template-columns:auto 1fr;font:12.5px/1.6 Consolas,"Cascadia Mono",monospace;min-width:max-content}
.ln{color:#a19f98;text-align:right;padding:12px 12px 12px 16px;user-select:none;background:#faf9f6;border-right:1px solid var(--rule);white-space:pre}
.tx{padding:12px 16px;white-space:pre;color:#24231f}
.wrap .tx{white-space:pre-wrap;word-break:break-word}.wrap .code{min-width:0}
</style>
<script type="module" src="text.js"></script></head><body>
<div class="vbar"><span class="lbl" id="info">Text</span><span class="sp"></span><button class="vb" id="wrap">Wrap lines</button></div>
<div class="vmain" id="main"><div class="scroll"><div class="code"><div class="ln" id="ln"></div><div class="tx" id="tx"></div></div></div></div>
</body></html>
