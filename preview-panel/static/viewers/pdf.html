<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF preview</title>
<link rel="stylesheet" href="../vendor/pdfjs/pdf_viewer.css">
<link rel="stylesheet" href="viewer.css">
<link rel="stylesheet" href="pdf.css">
<script type="module" src="pdf.js"></script>
</head><body>
<div class="vbar">
  <button class="vb" id="thumbs-btn" title="Pages"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="7" rx="1"/><rect x="4" y="13" width="6" height="7" rx="1"/><path d="M14 6h6M14 10h6M14 14h6M14 18h6"/></svg></button>
  <button class="vb" id="prev" title="Previous (←)"><svg viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg></button>
  <input class="num" id="page" aria-label="Page" value="1"><span class="lbl" id="count">/ –</span>
  <button class="vb" id="next" title="Next (→)"><svg viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></svg></button>
  <span class="sp"></span>
  <button class="vb" id="zout" title="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
  <select id="zoom" aria-label="Zoom">
    <option value="page-fit">Fit page</option><option value="page-width">Fit width</option>
    <option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option>
  </select>
  <button class="vb" id="zin" title="Zoom in"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  <input class="find" id="find" type="search" placeholder="Find in document" aria-label="Find">
  <button class="vb" id="present" title="Present (full screen)" hidden><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4m-4 0h8"/></svg></button>
</div>
<div class="vmain" id="main">
  <aside class="thumbs" id="thumbs"></aside>
  <div class="docwrap"><div id="viewerContainer"><div id="viewer" class="pdfViewer"></div></div></div>
</div>
</body></html>
