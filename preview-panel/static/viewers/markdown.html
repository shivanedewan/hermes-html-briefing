<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown preview</title><link rel="stylesheet" href="viewer.css">
<style>
.scroll{background:#fff}
article{max-width:760px;margin:0 auto;padding:36px 32px 60px;font-size:15.5px;line-height:1.7;color:#24231f}
article h1{font-size:2em;line-height:1.2;margin:0 0 .6em}article h2{font-size:1.4em;margin:1.6em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--rule)}
article h3{font-size:1.15em;margin:1.4em 0 .4em}article code{background:var(--soft);padding:.1em .35em;border-radius:4px;font-size:.9em}
article pre{background:#1e1e1c;color:#eee;padding:14px 16px;border-radius:8px;overflow:auto}article pre code{background:none;padding:0}
article blockquote{margin:1em 0;padding:.4em 1em;border-left:4px solid var(--accent);background:#fbf3ef;color:#5a3a30}
article table{border-collapse:collapse;margin:1em 0}article th,article td{border:1px solid var(--rule);padding:6px 12px}article th{background:var(--soft)}
article img{max-width:100%}article a{color:#2f5bd3}
</style>
<script src="../vendor/marked/marked.umd.js"></script>
<script src="../vendor/dompurify/purify.min.js"></script>
<script type="module" src="markdown.js"></script></head><body>
<div class="vmain" id="main"><div class="scroll"><article id="out"></article></div></div>
</body></html>
